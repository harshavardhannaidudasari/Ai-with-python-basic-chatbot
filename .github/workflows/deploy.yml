name: Deploy OrbitPro

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest and restart the server
        shell: powershell -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $projectDir = "F:\IdeaProjects\Ai-with-python-basic-chatbot"

          Set-Location $projectDir
          git -c safe.directory="F:/IdeaProjects/Ai-with-python-basic-chatbot" pull origin main
          if ($LASTEXITCODE -ne 0) {
            throw "git pull failed with exit code $LASTEXITCODE"
          }

          & "$projectDir\.venv\Scripts\python.exe" -m pip install -r requirements.txt -q
          if ($LASTEXITCODE -ne 0) {
            throw "pip install failed with exit code $LASTEXITCODE"
          }

          Get-CimInstance Win32_Process -Filter "Name='python.exe'" |
            Where-Object { $_.CommandLine -like '*web_app.py*' } |
            ForEach-Object {
              Write-Output "Stopping existing server (PID $($_.ProcessId))"
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }

          Start-Sleep -Seconds 2

          # Launch via Task Scheduler so the server process is fully detached from
          # the runner's job process tree (otherwise the runner kills it as an
          # "orphan" once this job step completes).
          $taskName = "OrbitProWebServer"
          cmd /c "schtasks /delete /tn $taskName /f >nul 2>&1"
          cmd /c "schtasks /create /tn $taskName /tr `"$projectDir\scripts\start_server.bat`" /sc once /st 00:00 /sd 01/01/2050 /f"
          if ($LASTEXITCODE -ne 0) {
            throw "schtasks create failed with exit code $LASTEXITCODE"
          }
          cmd /c "schtasks /run /tn $taskName >nul 2>&1"
          if ($LASTEXITCODE -ne 0) {
            throw "schtasks run failed with exit code $LASTEXITCODE"
          }

          Start-Sleep -Seconds 3

          $ok = $false
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5000/login" -UseBasicParsing -TimeoutSec 10
            $ok = $resp.StatusCode -eq 200
          } catch {
            $ok = $false
          }

          if (-not $ok) {
            Write-Error "Server did not come back up after deploy."
            exit 1
          }

          Write-Output "Deploy successful - server is responding."
